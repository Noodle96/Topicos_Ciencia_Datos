<svg viewBox="0 0 900 800" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="800" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Arquitectura de Husformer — fusión de 5 modalidades</text>

  <!-- Column x positions -->
  <!-- 5 columns, width 150, gap 17.5, total 5*150+4*17.5=820, start x=40 -->

  <!-- Row 1: inputs -->
  <g font-size="11.5" font-weight="700" fill="#111827">
    <rect x="40"  y="55" width="150" height="42" rx="6" fill="#f3f4f6" stroke="#9ca3af"/>
    <text x="115" y="80" text-anchor="middle">EEG (32ch)</text>

    <rect x="207.5" y="55" width="150" height="42" rx="6" fill="#f3f4f6" stroke="#9ca3af"/>
    <text x="282.5" y="80" text-anchor="middle">EOG (4ch)</text>

    <rect x="375" y="55" width="150" height="42" rx="6" fill="#f3f4f6" stroke="#9ca3af"/>
    <text x="450" y="80" text-anchor="middle">EMG (4ch)</text>

    <rect x="542.5" y="55" width="150" height="42" rx="6" fill="#f3f4f6" stroke="#9ca3af"/>
    <text x="617.5" y="80" text-anchor="middle">GSR (1ch)</text>

    <rect x="710" y="55" width="150" height="42" rx="6" fill="#f3f4f6" stroke="#9ca3af"/>
    <text x="785" y="73" text-anchor="middle" font-size="10.5">Resp+Plet+Temp</text>
    <text x="785" y="88" text-anchor="middle" font-size="10.5">(3ch)</text>
  </g>

  <!-- arrows row1 -> row2 -->
  <g stroke="#374151" stroke-width="1.3" marker-end="url(#arrow2)">
    <line x1="115"   y1="97" x2="115"   y2="122"/>
    <line x1="282.5" y1="97" x2="282.5" y2="122"/>
    <line x1="450"   y1="97" x2="450"   y2="122"/>
    <line x1="617.5" y1="97" x2="617.5" y2="122"/>
    <line x1="785"   y1="97" x2="785"   y2="122"/>
  </g>

  <!-- Row 2: linear projection -->
  <g font-size="10.5" font-weight="700" fill="#1e3a8a">
    <rect x="40"  y="122" width="150" height="38" rx="6" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="115" y="145" text-anchor="middle">Proyección lineal</text>

    <rect x="207.5" y="122" width="150" height="38" rx="6" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="282.5" y="145" text-anchor="middle">Proyección lineal</text>

    <rect x="375" y="122" width="150" height="38" rx="6" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="450" y="145" text-anchor="middle">Proyección lineal</text>

    <rect x="542.5" y="122" width="150" height="38" rx="6" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="617.5" y="145" text-anchor="middle">Proyección lineal</text>

    <rect x="710" y="122" width="150" height="38" rx="6" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="785" y="145" text-anchor="middle">Proyección lineal</text>
  </g>

  <!-- arrows row2 -> bus -->
  <g stroke="#374151" stroke-width="1.3">
    <line x1="115"   y1="160" x2="115"   y2="190"/>
    <line x1="282.5" y1="160" x2="282.5" y2="190"/>
    <line x1="450"   y1="160" x2="450"   y2="190"/>
    <line x1="617.5" y1="160" x2="617.5" y2="190"/>
    <line x1="785"   y1="160" x2="785"   y2="190"/>
  </g>

  <!-- shared bus (representa que CADA modulo de atencion cross-modal recibe las 5 proyecciones) -->
  <line x1="115" y1="190" x2="785" y2="190" stroke="#9ca3af" stroke-width="1.3" stroke-dasharray="4,3"/>
  <text x="450" y="183" text-anchor="middle" font-size="9.5" fill="#6b7280">cada módulo de atención cross-modal recibe las 5 proyecciones</text>

  <g stroke="#374151" stroke-width="1.3" marker-end="url(#arrow2)">
    <line x1="115"   y1="190" x2="115"   y2="215"/>
    <line x1="282.5" y1="190" x2="282.5" y2="215"/>
    <line x1="450"   y1="190" x2="450"   y2="215"/>
    <line x1="617.5" y1="190" x2="617.5" y2="215"/>
    <line x1="785"   y1="190" x2="785"   y2="215"/>
  </g>

  <!-- Row 3: cross-modal attention modules -->
  <g font-size="10" font-weight="700" fill="#7c2d12">
    <rect x="40"  y="215" width="150" height="50" rx="6" fill="#ffedd5" stroke="#ea580c"/>
    <text x="115" y="236" text-anchor="middle">Atención Cross-Modal</text>
    <text x="115" y="250" text-anchor="middle" font-size="9.5" font-weight="400">trans_m1_all</text>

    <rect x="207.5" y="215" width="150" height="50" rx="6" fill="#ffedd5" stroke="#ea580c"/>
    <text x="282.5" y="236" text-anchor="middle">Atención Cross-Modal</text>
    <text x="282.5" y="250" text-anchor="middle" font-size="9.5" font-weight="400">trans_m2_all</text>

    <rect x="375" y="215" width="150" height="50" rx="6" fill="#ffedd5" stroke="#ea580c"/>
    <text x="450" y="236" text-anchor="middle">Atención Cross-Modal</text>
    <text x="450" y="250" text-anchor="middle" font-size="9.5" font-weight="400">trans_m3_all</text>

    <rect x="542.5" y="215" width="150" height="50" rx="6" fill="#ffedd5" stroke="#ea580c"/>
    <text x="617.5" y="236" text-anchor="middle">Atención Cross-Modal</text>
    <text x="617.5" y="250" text-anchor="middle" font-size="9.5" font-weight="400">trans_m4_all</text>

    <rect x="710" y="215" width="150" height="50" rx="6" fill="#ffedd5" stroke="#ea580c"/>
    <text x="785" y="236" text-anchor="middle">Atención Cross-Modal</text>
    <text x="785" y="250" text-anchor="middle" font-size="9.5" font-weight="400">trans_m5_all</text>
  </g>
  <text x="450" y="278" text-anchor="middle" font-size="10" fill="#9a3412" font-style="italic">salida: attn_cross_summary (usada por Vista C)</text>

  <!-- converge to concatenation -->
  <g stroke="#374151" stroke-width="1.3">
    <line x1="115"   y1="265" x2="115"   y2="330"/>
    <line x1="282.5" y1="265" x2="282.5" y2="330"/>
    <line x1="450"   y1="265" x2="450"   y2="330"/>
    <line x1="617.5" y1="265" x2="617.5" y2="330"/>
    <line x1="785"   y1="265" x2="785"   y2="330"/>
    <line x1="115" y1="330" x2="785" y2="330"/>
  </g>
  <line x1="450" y1="330" x2="450" y2="355" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- Concatenacion -->
  <rect x="300" y="355" width="300" height="45" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="450" y="382" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Concatenación</text>

  <line x1="450" y1="400" x2="450" y2="435" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- Transformer final -->
  <rect x="250" y="435" width="400" height="60" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="450" y="461" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Transformer de Auto-Atención Final</text>
  <text x="450" y="480" text-anchor="middle" font-size="10.5" fill="#1e40af">trans_final — salida: attn_final_summary (usada por Vista B)</text>

  <line x1="450" y1="495" x2="450" y2="530" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- Conv + pooling -->
  <rect x="300" y="530" width="300" height="45" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="450" y="557" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Convolución + Pooling</text>

  <line x1="450" y1="575" x2="450" y2="610" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- last_hs -->
  <rect x="330" y="610" width="240" height="55" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="450" y="637" text-anchor="middle" font-size="14" font-weight="700" fill="#7c2d12">last_hs (40-dim)</text>
  <text x="450" y="654" text-anchor="middle" font-size="10" fill="#9a3412">usada por Vista A</text>

  <text x="450" y="720" text-anchor="middle" font-size="10.5" fill="#9ca3af">Basado en Wang et al. (2022), "Husformer: A Multi-Modal Transformer for Multi-Modal Human State Recognition" — adaptado a 5 modalidades de DEAP</text>
</svg>
