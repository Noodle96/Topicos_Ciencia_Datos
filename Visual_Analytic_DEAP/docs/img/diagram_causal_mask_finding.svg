<svg viewBox="0 0 900 660" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="660" fill="#ffffff"/>

  <text x="450" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Hallazgo: sesgo estructural por máscara causal</text>
  <text x="450" y="52" text-anchor="middle" font-size="11.5" fill="#6b7280">Matriz de desviación estándar de attn_final_summary, calculada sobre TODAS las ventanas de un split</text>

  <!-- ============ LEFT: CON mascara causal (bug) ============ -->
  <text x="230" y="95" text-anchor="middle" font-size="13.5" font-weight="700" fill="#b91c1c">CON máscara causal (bug encontrado)</text>

  <!-- modality labels left grid -->
  <g font-size="8.5" font-weight="700" fill="#374151">
    <text x="230" y="112" text-anchor="middle">modalidad fuente (columna, key)</text>
  </g>

  <!-- column labels -->
  <g font-size="8" fill="#4b5563" text-anchor="middle">
    <text x="146" y="128">EEG</text>
    <text x="182" y="128">EOG</text>
    <text x="218" y="128">EMG</text>
    <text x="254" y="128">GSR</text>
    <text x="290" y="128">RPT</text>
  </g>

  <!-- row labels -->
  <g font-size="8" fill="#4b5563" text-anchor="end">
    <text x="122" y="152">EEG</text>
    <text x="122" y="188">EOG</text>
    <text x="122" y="224">EMG</text>
    <text x="122" y="260">GSR</text>
    <text x="122" y="296">RPT</text>
  </g>
  <text x="98" y="222" text-anchor="middle" font-size="8.5" font-weight="700" fill="#374151" transform="rotate(-90, 98, 222)">módulo que pregunta (fila, query)</text>

  <!--
    Grid 5x5, cell 34x34, gap 2, origin x=128 y=134
    fila i (0..4) = query, columna j (0..4) = key
    BLOQUEADO (gris + X) cuando j > i  (key posterior en la concatenacion -> mascara causal lo tapa)
    Colores "reales" (variados) cuando j <= i
  -->
  <g>
    <!-- fila 0 (EEG pregunta) -->
    <rect x="128" y="134" width="34" height="34" fill="#1e3a8a"/>
    <rect x="164" y="134" width="34" height="34" fill="#e5e7eb"/><line x1="166" y1="136" x2="196" y2="166" stroke="#9ca3af" stroke-width="1.4"/><line x1="196" y1="136" x2="166" y2="166" stroke="#9ca3af" stroke-width="1.4"/>
    <rect x="200" y="134" width="34" height="34" fill="#e5e7eb"/><line x1="202" y1="136" x2="232" y2="166" stroke="#9ca3af" stroke-width="1.4"/><line x1="232" y1="136" x2="202" y2="166" stroke="#9ca3af" stroke-width="1.4"/>
    <rect x="236" y="134" width="34" height="34" fill="#e5e7eb"/><line x1="238" y1="136" x2="268" y2="166" stroke="#9ca3af" stroke-width="1.4"/><line x1="268" y1="136" x2="238" y2="166" stroke="#9ca3af" stroke-width="1.4"/>
    <rect x="272" y="134" width="34" height="34" fill="#e5e7eb"/><line x1="274" y1="136" x2="304" y2="166" stroke="#9ca3af" stroke-width="1.4"/><line x1="304" y1="136" x2="274" y2="166" stroke="#9ca3af" stroke-width="1.4"/>

    <!-- fila 1 (EOG pregunta) -->
    <rect x="128" y="170" width="34" height="34" fill="#2563eb"/>
    <rect x="164" y="170" width="34" height="34" fill="#3b82f6"/>
    <rect x="200" y="170" width="34" height="34" fill="#e5e7eb"/><line x1="202" y1="172" x2="232" y2="202" stroke="#9ca3af" stroke-width="1.4"/><line x1="232" y1="172" x2="202" y2="202" stroke="#9ca3af" stroke-width="1.4"/>
    <rect x="236" y="170" width="34" height="34" fill="#e5e7eb"/><line x1="238" y1="172" x2="268" y2="202" stroke="#9ca3af" stroke-width="1.4"/><line x1="268" y1="172" x2="238" y2="202" stroke="#9ca3af" stroke-width="1.4"/>
    <rect x="272" y="170" width="34" height="34" fill="#e5e7eb"/><line x1="274" y1="172" x2="304" y2="202" stroke="#9ca3af" stroke-width="1.4"/><line x1="304" y1="172" x2="274" y2="202" stroke="#9ca3af" stroke-width="1.4"/>

    <!-- fila 2 (EMG pregunta) -->
    <rect x="128" y="206" width="34" height="34" fill="#1d4ed8"/>
    <rect x="164" y="206" width="34" height="34" fill="#60a5fa"/>
    <rect x="200" y="206" width="34" height="34" fill="#93c5fd"/>
    <rect x="236" y="206" width="34" height="34" fill="#e5e7eb"/><line x1="238" y1="208" x2="268" y2="238" stroke="#9ca3af" stroke-width="1.4"/><line x1="268" y1="208" x2="238" y2="238" stroke="#9ca3af" stroke-width="1.4"/>
    <rect x="272" y="206" width="34" height="34" fill="#e5e7eb"/><line x1="274" y1="208" x2="304" y2="238" stroke="#9ca3af" stroke-width="1.4"/><line x1="304" y1="208" x2="274" y2="238" stroke="#9ca3af" stroke-width="1.4"/>

    <!-- fila 3 (GSR pregunta) -->
    <rect x="128" y="242" width="34" height="34" fill="#1e40af"/>
    <rect x="164" y="242" width="34" height="34" fill="#3b82f6"/>
    <rect x="200" y="242" width="34" height="34" fill="#60a5fa"/>
    <rect x="236" y="242" width="34" height="34" fill="#bfdbfe"/>
    <rect x="272" y="242" width="34" height="34" fill="#e5e7eb"/><line x1="274" y1="244" x2="304" y2="274" stroke="#9ca3af" stroke-width="1.4"/><line x1="304" y1="244" x2="274" y2="274" stroke="#9ca3af" stroke-width="1.4"/>

    <!-- fila 4 (RPT pregunta) -- unico bloque que atiende a los 5 -->
    <rect x="128" y="278" width="34" height="34" fill="#1e3a8a"/>
    <rect x="164" y="278" width="34" height="34" fill="#2563eb"/>
    <rect x="200" y="278" width="34" height="34" fill="#3b82f6"/>
    <rect x="236" y="278" width="34" height="34" fill="#60a5fa"/>
    <rect x="272" y="278" width="34" height="34" fill="#93c5fd"/>

    <rect x="128" y="134" width="178" height="178" fill="none" stroke="#9ca3af" stroke-width="1"/>
  </g>

  <!-- anotaciones -->
  <line x1="310" y1="151" x2="345" y2="151" stroke="#b91c1c" stroke-width="1.2" marker-end="url(#arrowRed)"/>
  <text x="350" y="146" font-size="9.5" fill="#b91c1c" font-weight="700">EEG solo se</text>
  <text x="350" y="158" font-size="9.5" fill="#b91c1c" font-weight="700">atiende a sí mismo</text>

  <line x1="310" y1="295" x2="345" y2="295" stroke="#b91c1c" stroke-width="1.2" marker-end="url(#arrowRed)"/>
  <text x="350" y="290" font-size="9.5" fill="#b91c1c" font-weight="700">RPT es el único que</text>
  <text x="350" y="302" font-size="9.5" fill="#b91c1c" font-weight="700">atiende a los 5</text>

  <defs>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#15803d"/>
    </marker>
  </defs>

  <text x="230" y="335" text-anchor="middle" font-size="9" fill="#6b7280">Triángulo superior = cero exacto en TODAS las ventanas → no es un patrón aprendido, es la máscara</text>

  <!-- ============ RIGHT: SIN mascara causal (corregido) ============ -->
  <text x="670" y="95" text-anchor="middle" font-size="13.5" font-weight="700" fill="#15803d">SIN máscara causal (corregido)</text>
  <text x="670" y="112" text-anchor="middle" font-size="8.5" font-weight="700" fill="#374151">modalidad fuente (columna, key)</text>

  <g font-size="8" fill="#4b5563" text-anchor="middle">
    <text x="586" y="128">EEG</text>
    <text x="622" y="128">EOG</text>
    <text x="658" y="128">EMG</text>
    <text x="694" y="128">GSR</text>
    <text x="730" y="128">RPT</text>
  </g>

  <g font-size="8" fill="#4b5563" text-anchor="end">
    <text x="562" y="152">EEG</text>
    <text x="562" y="188">EOG</text>
    <text x="562" y="224">EMG</text>
    <text x="562" y="260">GSR</text>
    <text x="562" y="296">RPT</text>
  </g>
  <text x="538" y="222" text-anchor="middle" font-size="8.5" font-weight="700" fill="#374151" transform="rotate(-90, 538, 222)">módulo que pregunta (fila, query)</text>

  <!-- Grid derecha: 25 celdas TODAS con valor real (variado, sin patron triangular) -->
  <g>
    <rect x="568" y="134" width="34" height="34" fill="#ea580c"/>
    <rect x="604" y="134" width="34" height="34" fill="#fb923c"/>
    <rect x="640" y="134" width="34" height="34" fill="#3b82f6"/>
    <rect x="676" y="134" width="34" height="34" fill="#fdba74"/>
    <rect x="712" y="134" width="34" height="34" fill="#60a5fa"/>

    <rect x="568" y="170" width="34" height="34" fill="#fb923c"/>
    <rect x="604" y="170" width="34" height="34" fill="#1d4ed8"/>
    <rect x="640" y="170" width="34" height="34" fill="#fdba74"/>
    <rect x="676" y="170" width="34" height="34" fill="#ea580c"/>
    <rect x="712" y="170" width="34" height="34" fill="#93c5fd"/>

    <rect x="568" y="206" width="34" height="34" fill="#3b82f6"/>
    <rect x="604" y="206" width="34" height="34" fill="#fdba74"/>
    <rect x="640" y="206" width="34" height="34" fill="#1e3a8a"/>
    <rect x="676" y="206" width="34" height="34" fill="#60a5fa"/>
    <rect x="712" y="206" width="34" height="34" fill="#f97316"/>

    <rect x="568" y="242" width="34" height="34" fill="#fdba74"/>
    <rect x="604" y="242" width="34" height="34" fill="#ea580c"/>
    <rect x="640" y="242" width="34" height="34" fill="#93c5fd"/>
    <rect x="676" y="242" width="34" height="34" fill="#1e40af"/>
    <rect x="712" y="242" width="34" height="34" fill="#fb923c"/>

    <rect x="568" y="278" width="34" height="34" fill="#60a5fa"/>
    <rect x="604" y="278" width="34" height="34" fill="#93c5fd"/>
    <rect x="640" y="278" width="34" height="34" fill="#f97316"/>
    <rect x="676" y="278" width="34" height="34" fill="#fb923c"/>
    <rect x="712" y="278" width="34" height="34" fill="#1d4ed8"/>

    <rect x="568" y="134" width="178" height="178" fill="none" stroke="#9ca3af" stroke-width="1"/>
  </g>

  <line x1="750" y1="151" x2="785" y2="151" stroke="#15803d" stroke-width="1.2" marker-end="url(#arrowGreen)"/>
  <text x="790" y="146" font-size="9.5" fill="#15803d" font-weight="700">Todas las modalidades</text>
  <text x="790" y="158" font-size="9.5" fill="#15803d" font-weight="700">se atienden entre sí</text>

  <text x="670" y="335" text-anchor="middle" font-size="9" fill="#6b7280">Variación real entre ventanas y entre trials — el ranking de dominancia deja de ser fijo</text>

  <!-- Concatenacion order strip -->
  <text x="450" y="390" text-anchor="middle" font-size="11.5" font-weight="700" fill="#111827">Orden de concatenación de las 5 modalidades (mismo orden en ambas matrices)</text>
  <g font-size="10.5" font-weight="700">
    <rect x="150" y="405" width="120" height="34" rx="6" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="210" y="426" text-anchor="middle" fill="#1e3a8a">EEG</text>
    <rect x="280" y="405" width="120" height="34" rx="6" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="340" y="426" text-anchor="middle" fill="#1e3a8a">EOG</text>
    <rect x="410" y="405" width="120" height="34" rx="6" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="470" y="426" text-anchor="middle" fill="#1e3a8a">EMG</text>
    <rect x="540" y="405" width="120" height="34" rx="6" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="600" y="426" text-anchor="middle" fill="#1e3a8a">GSR</text>
    <rect x="670" y="405" width="120" height="34" rx="6" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="730" y="426" text-anchor="middle" fill="#1e3a8a">Resp+Plet+Temp</text>
  </g>
  <text x="450" y="460" text-anchor="middle" font-size="9.5" fill="#6b7280">Con máscara causal: la posición en esta fila determina cuánto puede atender cada bloque —</text>
  <text x="450" y="474" text-anchor="middle" font-size="9.5" fill="#6b7280">un sesgo puramente ESTRUCTURAL, no un patrón aprendido de los datos.</text>

  <!-- causa raiz -->
  <rect x="130" y="500" width="640" height="120" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.3"/>
  <text x="450" y="524" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">Causa raíz</text>
  <text x="450" y="546" text-anchor="middle" font-size="10" fill="#7f1d1d">Husformer (heredado de MulT) aplica por default una máscara causal (attn_mask=True) sobre las</text>
  <text x="450" y="562" text-anchor="middle" font-size="10" fill="#7f1d1d">posiciones concatenadas de las 5 modalidades — diseñada para texto/audio con orden temporal real.</text>
  <text x="450" y="584" text-anchor="middle" font-size="10" font-weight="700" fill="#166534">Corrección: reentrenar con attn_mask=False — las 5 modalidades fisiológicas no tienen</text>
  <text x="450" y="600" text-anchor="middle" font-size="10" font-weight="700" fill="#166534">ninguna relación de orden temporal real entre sí.</text>

  <text x="450" y="645" text-anchor="middle" font-size="10" fill="#9ca3af">Visual Analytics sobre DEAP · Jorge Tito Ccahuaya · hallazgo diagnosticado con diagnostico_attn_final.py</text>
</svg>
